<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Deploy Tool — Thuê Xe Nhanh</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0f18;color:#dde2ec;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:0 20px;height:48px;background:#131620;border-bottom:1px solid #1e2235;flex-shrink:0}
.logo{font-size:15px;font-weight:700;color:#fff}.logo b{color:#4fc3f7}
.branch-badge{margin-left:auto;display:flex;align-items:center;gap:6px;background:#1e2235;border:1px solid #2a2f45;padding:4px 12px;border-radius:20px;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#4caf50}

.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:250px;background:#10121b;border-right:1px solid #1e2235;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb-sec{padding:14px 12px;border-bottom:1px solid #1a1d2e}
.sb-lbl{font-size:10px;font-weight:700;color:#546e7a;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}

.abtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid transparent;border-radius:10px;cursor:pointer;background:transparent;transition:all .15s;margin-bottom:6px}
.abtn:disabled{opacity:.4;cursor:not-allowed}
.abtn .ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.abtn .txt strong{display:block;font-size:13px;font-weight:600;color:#e8eaf6;text-align:left}
.abtn .txt span{display:block;font-size:11px;color:#546e7a;text-align:left;margin-top:1px}

.abtn-test{border-color:#1a2744}.abtn-test .ico{background:#0d1f44;color:#64b5f6}
.abtn-test:hover:not(:disabled){background:#131d35;border-color:#2a4070}
.abtn-dev{border-color:#1a2e1a}.abtn-dev .ico{background:#0d270d;color:#81c784}
.abtn-dev:hover:not(:disabled){background:#131f13;border-color:#2a4a2a}
.abtn-main{border-color:#2e1a1a}.abtn-main .ico{background:#270d0d;color:#e57373}
.abtn-main:hover:not(:disabled){background:#1f1313;border-color:#4a2a2a}

.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #181b2a}
.stat:last-child{border:none}
.stat .k{font-size:11px;color:#546e7a}.stat .v{font-size:12px;font-weight:600}
.ok{color:#66bb6a}.warn{color:#ffd54f}.err{color:#ef5350}

.commit-item{background:#13162060;border:1px solid #1e2235;border-radius:8px;padding:7px 10px;margin-bottom:5px}
.commit-item .ch{font-family:monospace;font-size:10px;color:#4fc3f7;margin-bottom:2px}
.commit-item .cm{font-size:11px;color:#b0bec5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.commit-item .ca{font-size:10px;color:#37474f;margin-top:1px}

/* RIGHT */
.right{display:flex;flex-direction:column;flex:1;overflow:hidden}

/* Steps */
.steps-wrap{flex-shrink:0;border-bottom:1px solid #1e2235;padding:12px 16px}
.steps-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid #1e2235;background:#0d0f18;font-size:12px;font-weight:500;color:#546e7a;transition:all .2s;white-space:nowrap}
.step-chip .si{font-size:13px}
.step-chip.waiting{opacity:.4}
.step-chip.running{border-color:#1565c0;background:#081828;color:#90caf9}
.step-chip.running .si{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.step-chip.ok{border-color:#2e7d32;background:#071408;color:#81c784}
.step-chip.fail{border-color:#b71c1c;background:#180808;color:#ef9a9a}
.step-sep{color:#1e2235;font-size:14px}

.pipe-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pipe-title{font-size:12px;font-weight:600;color:#78909c}
.timer{font-size:11px;color:#37474f;font-variant-numeric:tabular-nums}

/* Log */
.log-area{flex:1;overflow-y:auto;padding:12px 16px;font-family:'Cascadia Code','Consolas',monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;word-break:break-all;background:#090b12}
.l-dim{color:#2e3a40}.l-ok{color:#81c784}.l-err{color:#ef9a9a}.l-yellow{color:#ffd54f}

/* Input */
.input-bar{display:flex;gap:8px;padding:10px 14px;background:#10121b;border-top:1px solid #1e2235;flex-shrink:0}
.input-bar input{flex:1;background:#13162060;border:1px solid #1e2235;border-radius:8px;padding:8px 12px;color:#dde2ec;font-size:12px;outline:none;transition:border-color .15s}
.input-bar input:focus{border-color:#1565c0}
.input-bar input::placeholder{color:#2e3a40}
.rbtn{background:#13162060;border:1px solid #1e2235;color:#546e7a;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px}
.rbtn:hover{color:#90a4ae}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#1e2235;border-radius:2px}
</style>
</head>
<body>
<header>
  <span>🚗</span>
  <div class="logo">Thuê Xe <b>Nhanh</b> — Deploy Tool</div>
  <div class="branch-badge"><div class="dot"></div><span id="hBranch">dev</span></div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sb-sec">
      <div class="sb-lbl">Hành Động</div>

      <button class="abtn abtn-test" id="btnTest" onclick="doAction('test')">
        <div class="ico">⚡</div>
        <div class="txt"><strong>Test</strong><span>Mở server xem thử trên máy</span></div>
      </button>

      <button class="abtn abtn-dev" id="btnDev" onclick="doAction('dev')">
        <div class="ico">🔧</div>
        <div class="txt"><strong>Dev</strong><span>Kiểm tra + Đẩy lên nhánh Dev</span></div>
      </button>

      <button class="abtn abtn-main" id="btnMain" onclick="doAction('main')">
        <div class="ico">🚀</div>
        <div class="txt"><strong>Main</strong><span>Đẩy Dev lên bản chính thức</span></div>
      </button>
    </div>

    <div class="sb-sec">
      <div class="sb-lbl">Tổng Quan</div>
      <div class="stat"><span class="k">Nhánh</span><span class="v ok" id="ovBranch">—</span></div>
      <div class="stat"><span class="k">Chưa commit</span><span class="v" id="ovChanged">—</span></div>
      <div class="stat"><span class="k">Trạng thái</span><span class="v ok" id="ovStatus">Sẵn sàng</span></div>
    </div>

    <div class="sb-sec">
      <div class="sb-lbl">Code Thay Đổi (Chưa commit)</div>
      <div id="codeStat" style="font-size:11px;color:#90a4ae;margin-bottom:8px;font-style:italic">—</div>
      <div id="changesList" style="display:flex;flex-direction:column;gap:4px">
         <!-- files will go here -->
      </div>
    </div>

    <div class="sb-sec" style="border:none;flex:1">
      <div class="sb-lbl">Lịch sử commit</div>
      <div id="commitList"></div>
    </div>
  </div>

  <div class="right">
    <div class="steps-wrap">
      <div class="pipe-header">
        <span class="pipe-title" id="pTitle">Chưa có tiến trình</span>
        <span class="timer" id="pTimer"></span>
      </div>
      <div class="steps-row" id="stepsRow">
        <div class="step-chip waiting"><span class="si">○</span> Chờ lệnh</div>
      </div>
    </div>

    <div id="logArea" class="log-area"><span class="l-dim">// Chọn một hành động bên trái để bắt đầu...</span></div>

    <div class="input-bar">
      <input type="text" id="commitMsg" placeholder="Ghi chú commit (dùng khi bấm Dev)..."/>
      <button class="rbtn" onclick="refreshInfo()" title="Làm mới">↻</button>
    </div>
  </div>
</div>

<script>
const es = new EventSource('/events');
let running = false;
let timerInterval, timerStart;

es.onmessage = e => {
  const d = JSON.parse(e.data);

  if (d.type === 'start') {
    document.getElementById('logArea').innerHTML = '';
    document.getElementById('pTitle').textContent = {
      dev:  '🔧 Deploy Dev',
      main: '🚀 Deploy Main'
    }[d.action] || '';
    // Render step chips
    const row = document.getElementById('stepsRow');
    row.innerHTML = d.steps.map((s, i) =>
      `${i > 0 ? '<span class="step-sep">›</span>' : ''}
       <div class="step-chip waiting" id="chip-${s.id}">
         <span class="si">○</span> ${s.label}
       </div>`
    ).join('');
    running = true;
    setButtons(true);
    timerStart = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      document.getElementById('pTimer').textContent = `⏱ ${((Date.now()-timerStart)/1000).toFixed(0)}s`;
    }, 500);
    setStatus('Đang xử lý...', 'warn');
  }

  else if (d.type === 'step') {
    const chip = document.getElementById(`chip-${d.id}`);
    if (!chip) return;
    const icons = { running: '⟳', ok: '✓', fail: '✗' };
    chip.className = `step-chip ${d.state}`;
    chip.innerHTML = `<span class="si">${icons[d.state]||'○'}</span> ${chip.textContent.trim().slice(1).trim()}${d.elapsed ? ` <small style="opacity:.6">${d.elapsed}s</small>` : ''}`;
  }

  else if (d.type === 'log') {
    const la = document.getElementById('logArea');
    const s = document.createElement('span');
    s.className = { err:'l-err', ok:'l-ok', yellow:'l-yellow', dim:'l-dim' }[d.color] || '';
    s.textContent = d.text + '\n';
    la.appendChild(s);
    la.scrollTop = la.scrollHeight;
  }

  else if (d.type === 'done') {
    clearInterval(timerInterval);
    const total = ((Date.now()-timerStart)/1000).toFixed(1);
    document.getElementById('pTimer').textContent = `${d.code === 0 ? '✓' : '✗'} ${total}s`;
    running = false;
    setButtons(false);
    setStatus(d.code === 0 ? 'Thành công ✓' : 'Có lỗi — cần sửa', d.code === 0 ? 'ok' : 'err');
    if (d.code === 0) setTimeout(refreshInfo, 1500);
  }
};

function setButtons(disabled) {
  ['btnDev','btnMain'].forEach(id => document.getElementById(id).disabled = disabled);
}

function setStatus(text, cls) {
  const el = document.getElementById('ovStatus');
  el.textContent = text; el.className = 'v ' + cls;
}

function doAction(action) {
  if (action !== 'test' && running) return;
  const msg = document.getElementById('commitMsg').value;
  if (action === 'test') {
    fetch('/action/test');
    return;
  }
  fetch('/action/' + action, { method: 'POST', body: JSON.stringify({ msg }), headers: { 'Content-Type': 'application/json' } });
}

function refreshInfo() {
  fetch('/git-info').then(r=>r.json()).then(d => {
    document.getElementById('hBranch').textContent = d.branch || '—';
    document.getElementById('ovBranch').textContent = d.branch || '—';
    
    const ch = d.changedCount || 0;
    const el = document.getElementById('ovChanged');
    el.textContent = ch === 0 ? '0 file' : `${ch} file`;
    el.className = 'v ' + (ch === 0 ? 'ok' : 'warn');
    
    document.getElementById('codeStat').textContent = d.stat || 'Không có thay đổi dòng';
    
    const changesHTML = (d.changesList || []).map(f => {
      let color = '#546e7a';
      if (f.type.includes('M')) color = '#4fc3f7'; // modified (blue)
      if (f.type.includes('A') || f.type.includes('?')) color = '#81c784'; // added (green)
      if (f.type.includes('D')) color = '#ef5350'; // deleted (red)
      return `<div style="display:flex;align-items:center;gap:6px;font-size:11px">
                <span style="color:${color};font-weight:bold;width:16px;text-align:center">${f.type}</span>
                <span style="color:#cfd8dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${f.file}">${f.file}</span>
              </div>`;
    }).join('');
    document.getElementById('changesList').innerHTML = changesHTML || '<span style="font-size:11px;color:#37474f">Sạch sẽ, không có file nào thay đổi.</span>';

    document.getElementById('commitList').innerHTML = (d.logs||[]).map(c =>
      `<div class="commit-item"><div class="ch">${c.h}</div><div class="cm">${c.m}</div><div class="ca">${c.t}</div></div>`
    ).join('') || '<span style="font-size:11px;color:#37474f">Chưa có commit</span>';
  });
}

refreshInfo();
setInterval(refreshInfo, 20000);
</script>
</body>
</html>
